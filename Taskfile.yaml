version: "3"
set: ["e", "u", "pipefail"]
interval: 2s
env: {}

# toknt is a self-contained Rust binary. The Node toolchain stays only to format
# the repo's Markdown/configs (prettier) — hence the `fmt:md` task.
#
# Run tasks inside the repo's mise environment so `.env` API keys load (mise
# auto-loads `.env`); `verify` and live counts need them.
tasks:
  build:
    desc: Debug build
    cmd: cargo build

  build:release:
    desc: Release build -> target/release/toknt(-verify)
    cmd: cargo build --release

  run:
    desc: Run a binary (pass args after --, e.g. `task run -- --bin toknt-verify`)
    cmd: cargo run {{.CLI_ARGS}}

  test:
    desc: Correctness guards (does not rewrite verification.json)
    cmd: cargo test

  clippy:
    desc: Lint — keep clean
    cmd: cargo clippy --all-targets -- -D warnings

  fmt:
    desc: Format Rust sources
    cmd: cargo fmt

  fmt:check:
    desc: Verify Rust formatting
    cmd: cargo fmt --check

  fmt:md:
    desc: Format Markdown/configs with prettier (Node dev-tooling)
    cmd: prettier --write "**/*.md"

  check:
    desc: Full local gate — build, lint, format check, tests
    cmds:
      - cargo build
      - cargo clippy --all-targets -- -D warnings
      - cargo fmt --check
      - cargo test

  verify:
    desc: Live verification gate — drive the core over all proof targets and (re)write verification.json
    cmd: cargo run --bin toknt-verify
