name: Build binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build optimized CLI
        run: cargo build --locked --release --bin toknt --target "$TARGET"

      - name: Exercise the built CLI
        run: |
          binary="target/$TARGET/release/toknt${{ matrix.extension }}"
          "$binary" --version
          "$binary" --help
          test "$("$binary" --offline -m o200k_base -t "hello world")" = "2"

      - name: Package binary and checksum
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          windows = os.name == "nt"
          binary = Path("target") / target / "release" / ("toknt.exe" if windows else "toknt")
          output = Path("dist")
          output.mkdir()
          suffix = ".zip" if windows else ".tar.gz"
          archive = output / f"toknt-{target}{suffix}"
          if windows:
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as package:
                  package.write(binary, binary.name)
                  package.write("README.md")
          else:
              with tarfile.open(archive, "w:gz") as package:
                  package.add(binary, arcname=binary.name)
                  package.add("README.md")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(f"{archive}.sha256").write_text(f"{digest}  {archive.name}\n", encoding="utf-8")
          PYTHON

      - name: Upload binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toknt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
